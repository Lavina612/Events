# PostgreSQL для EventApi — локально совпадает с appsettings.json, в Docker — с appsettings.Production.json
# Запуск из корня репозитория: docker compose up -d (или docker compose up --build -d после изменений в коде)
# Остановка: docker compose down
# Данные сохраняются в именованном томе postgres-data

services:
  # ─────────────────────────── Инфраструктура обмена сообщениями ───────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: eventapi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: eventapi-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # Внешний listener для подключения с хоста (например, из dotnet run локально).    
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Два listener'а: INTERNAL — для сервисов внутри сети Docker, EXTERNAL — для хоста.      
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # ─────────────────────────── Базы данных (по одной на сервис) ───────────────────────────      
  users-db:
    image: postgres:16
    container_name: eventapi-users-db
    environment:
      POSTGRES_DB: eventapi_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5436:5432"

  events-db:
    image: postgres:16
    container_name: eventapi-events-db
    environment:
      POSTGRES_DB: eventapi_events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5434:5432"

  bookings-db:
    image: postgres:16
    container_name: eventapi-bookings-db
    environment:
      POSTGRES_DB: eventapi_bookings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - bookings-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5435:5432"

  # ─────────────────────────── Микросервисы ───────────────────────────  
  user-service:
    image: eventapi-user-service
    container_name: eventapi-user-service
    build:
      context: .
      dockerfile: src/Services/UserService/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      users-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  event-service:
    image: eventapi-event-service
    container_name: eventapi-event-service
    build:
      context: .
      dockerfile: src/Services/EventService/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  booking-service:
    image: eventapi-booking-service
    container_name: eventapi-booking-service
    build:
      context: .
      dockerfile: src/Services/BookingService/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  users-db-data:
  events-db-data:
  bookings-db-data:
